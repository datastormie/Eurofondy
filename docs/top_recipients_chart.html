<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 25 Recipients — Slovakia 2021–2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .chart-wrap { height: 900px; }
  @media (max-width: 768px) { .chart-wrap { height: 750px; } }
  @media (max-width: 480px) { .chart-wrap { height: 650px; } }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html">
    <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="11" fill="#003399"/>
      <g fill="#FFCC00">
        <circle cx="12" cy="4" r="1.15"/><circle cx="18.5" cy="7.8" r="1.15"/><circle cx="18.5" cy="16.2" r="1.15"/>
        <circle cx="12" cy="20" r="1.15"/><circle cx="5.5" cy="16.2" r="1.15"/><circle cx="5.5" cy="7.8" r="1.15"/>
      </g>
    </svg>
    EU Funds Slovakia
  </a>
  <nav class="nav-links">
    <a href="index.html">Programs</a>
    <a href="projects.html">Projects</a>
    <a href="top_projects_chart.html">Top 50 Projects</a>
    <a class="current" href="top_recipients_chart.html">Top 25 Recipients</a>
  </nav>
</div>
<div class="card card--narrow">
  <h1>Top 25 Recipients</h1>
  <span class="title-rule"></span>
  <p class="subtitle">EU vs. national (SR) contribution, summed across all their projects</p>
  <p class="updated" id="updated-label">Loading...</p>
  <p class="hint">Tip: click a bar to see that recipient's projects.</p>

  <p class="error" style="display:none;" id="error-box"></p>

  <div class="chart-wrap">
    <canvas id="topRecipientsChart"></canvas>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="projects_logic.js"></script>
<script>
const HAS_CHART = typeof Chart !== 'undefined';
if (HAS_CHART) {
  Chart.defaults.font.family = "'Montserrat', Arial, Helvetica, sans-serif";
}

const JSON_URL = 'project_data.json';

function formatIsoDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function formatEURShort(value) {
  if (value >= 1e9) return (value / 1e9).toFixed(2) + ' B';
  if (value >= 1e6) return (value / 1e6).toFixed(1) + ' M';
  if (value >= 1e3) return (value / 1e3).toFixed(0) + ' K';
  return Number(value).toLocaleString();
}

function goToRecipientProjects(recipientName) {
  window.location.href = 'projects.html?recipient=' + encodeURIComponent(recipientName);
}

function renderTopRecipientsChart(data) {
  if (!HAS_CHART) {
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-box').textContent = 'Chart library failed to load. Please check your connection and reload.';
    return;
  }

  const aggregated = ProjectsLogic.aggregateByRecipient(data);
  const top25 = aggregated.slice(0, 25);
  // Sorted descending (largest first) so the biggest recipient renders at the top,
  // matching Chart.js's default horizontal-bar ordering (first array item = top).
  const ordered = top25;

  const recipientNames = ordered.map(function (r) { return r.recipient; });
  const labels = recipientNames.map(function (name) {
    return name.length > 50 ? name.slice(0, 47) + '…' : name;
  });
  const srAmounts = ordered.map(function (r) { return r.suma_sr; });
  const euAmounts = ordered.map(function (r) { return r.suma_eu; });
  const projectCounts = ordered.map(function (r) { return r.project_count; });

  const ctx = document.getElementById('topRecipientsChart').getContext('2d');

  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: 'SR (€)', data: srAmounts, backgroundColor: '#7C93C7', borderRadius: 3 },
        { label: 'EU (€)', data: euAmounts, backgroundColor: '#003399', borderRadius: 3 }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      onClick: function (evt, elements) {
        if (elements.length > 0) {
          const idx = elements[0].index;
          goToRecipientProjects(recipientNames[idx]);
        }
      },
      onHover: function (evt, elements) {
        evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
      },
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          callbacks: {
            title: function (items) { return recipientNames[items[0].dataIndex]; },
            label: function (item) {
              return item.dataset.label + ': €' + item.raw.toLocaleString(undefined, { maximumFractionDigits: 0 });
            },
            footer: function (items) {
              const i = items[0].dataIndex;
              const total = srAmounts[i] + euAmounts[i];
              return [
                'Total: €' + total.toLocaleString(undefined, { maximumFractionDigits: 0 }),
                'Projects: ' + projectCounts[i],
                'Click to view this recipient\'s projects'
              ];
            }
          }
        }
      },
      scales: {
        x: {
          stacked: true,
          beginAtZero: true,
          ticks: { callback: function (v) { return '€' + formatEURShort(v); } },
          title: { display: true, text: 'Amount (EUR)' }
        },
        y: {
          stacked: true,
          ticks: { autoSkip: false, font: { size: 10 } }
        }
      }
    }
  });
}

fetch(JSON_URL)
  .then(function (response) {
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  })
  .then(function (payload) {
    const data = payload.projects;
    document.getElementById('updated-label').textContent = 'Last updated: ' + formatIsoDate(payload.generated_at);
    renderTopRecipientsChart(data);
  })
  .catch(function (err) {
    document.getElementById('updated-label').textContent = '';
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.textContent = 'Could not load ' + JSON_URL + ': ' + err.message;
  });
</script>
</body>
</html>
