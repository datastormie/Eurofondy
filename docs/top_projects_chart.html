<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 50 Most Expensive Projects — Slovakia 2021–2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
<style>
  .scale-toggle { text-align: center; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .scale-toggle label { margin-right: 20px; cursor: pointer; display: inline-block; }
  .chart-wrap { height: 1400px; }
  @media (max-width: 768px) { .chart-wrap { height: 1100px; } }
  @media (max-width: 480px) { .chart-wrap { height: 950px; } }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html">
    <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="11" fill="#003399"/>
      <g fill="#FFCC00">
        <circle cx="12" cy="4" r="1.15"/><circle cx="18.5" cy="7.8" r="1.15"/><circle cx="18.5" cy="16.2" r="1.15"/>
        <circle cx="12" cy="20" r="1.15"/><circle cx="5.5" cy="16.2" r="1.15"/><circle cx="5.5" cy="7.8" r="1.15"/>
      </g>
    </svg>
    EU Funds Slovakia
  </a>
  <nav class="nav-links">
    <a href="index.html">Programs</a>
    <a href="projects.html">Projects</a>
    <a class="current" href="top_projects_chart.html">Top 50 Projects</a>
    <a href="regional_funding.html">Regional Funding</a>
    <a href="beneficiaries.html">Beneficiaries</a>
    <a href="procurement.html">Procurement</a>
    <a href="disbursements.html">Disbursements</a>
  </nav>
</div>
<div class="card card--narrow">
  <h1>Top 50 Most Expensive Projects</h1>
  <span class="title-rule"></span>
  <p class="subtitle">EU vs. national (SR) contribution — most expensive on top</p>
  <p class="updated" id="updated-label">Loading...</p>
  <p class="hint">Tip: click a bar to open that project in the projects table.</p>

  <p class="error" style="display:none;" id="error-box"></p>

  <div class="scale-toggle">
    <label><input type="radio" name="scale" value="linear" checked> Linear scale</label>
    <label><input type="radio" name="scale" value="logarithmic"> Log scale</label>
  </div>

  <div class="chart-wrap">
    <canvas id="topProjectsChart"></canvas>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="projects_logic.js"></script>
<script>
const HAS_CHART = typeof Chart !== 'undefined';
if (HAS_CHART) {
  Chart.defaults.font.family = "'Montserrat', Arial, Helvetica, sans-serif";
}

const JSON_URL = 'regional_funding_data.json';

function formatIsoDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function formatEURShort(value) {
  if (value >= 1e9) return (value / 1e9).toFixed(2) + ' B';
  if (value >= 1e6) return (value / 1e6).toFixed(1) + ' M';
  if (value >= 1e3) return (value / 1e3).toFixed(0) + ' K';
  return Number(value).toLocaleString();
}

function goToProject(kod, nazov) {
  if (!kod) return;
  window.location.href = 'projects.html?kod=' + encodeURIComponent(kod) +
    (nazov ? '&nazov=' + encodeURIComponent(nazov) : '');
}

let topChart = null;
let lastData = null;

function renderTopChart(data) {
  if (!HAS_CHART) {
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-box').textContent = 'Chart library failed to load. Please check your connection and reload.';
    return;
  }

  const top50 = ProjectsLogic.topNByAmount(data, 50, 'celkova_zazmluvnena_suma');
  // Chart.js horizontal bars (indexAxis:'y') render the FIRST array item at the TOP by default,
  // so keeping top50 sorted descending (largest first) puts the most expensive project at the top.
  const ordered = top50;

  const codes = ordered.map(function (p) { return p.project_kod || ''; });

  const labels = ordered.map(function (p) {
    const name = p.project_nazov || p.project_kod || ('#' + p.project_id);
    return name.length > 55 ? name.slice(0, 52) + '…' : name;
  });
  const fullNames = ordered.map(function (p) { return p.project_nazov || ''; });
  const programs = ordered.map(function (p) { return p.program_skratka || ''; });
  const programNames = ordered.map(function (p) { return p.program_nazov || ''; });
  const srAmounts = ordered.map(function (p) { return p.suma_sr || 0; });
  const euAmounts = ordered.map(function (p) { return p.suma_eu || 0; });
  const totals = ordered.map(function (p, i) { return srAmounts[i] + euAmounts[i]; });
  const maxTotal = totals.length ? Math.max.apply(null, totals) : 0;
  const positiveTotals = totals.filter(function (v) { return v > 0; });
  const minTotal = positiveTotals.length ? Math.min.apply(null, positiveTotals) : 0;

  const scaleType = document.querySelector('input[name="scale"]:checked').value;
  const isLog = scaleType === 'logarithmic';
  // Headroom past the largest total so its value label and the mirrored top
  // axis both have room — log scale compresses distances near the top, so
  // it needs a bigger multiplier than linear to get the same visual gap.
  const xMax = maxTotal * (isLog ? 2.2 : 1.18);
  const xMin = isLog ? Math.max(minTotal * 0.5, 1) : 0;

  // Draws the SR+EU total at the end of each stacked bar.
  const totalLabelsPlugin = {
    id: 'totalLabels',
    afterDatasetsDraw: function (chart) {
      const ctx = chart.ctx;
      const meta = chart.getDatasetMeta(1);
      ctx.save();
      ctx.fillStyle = '#1f2937';
      ctx.font = "600 11px 'Montserrat', Arial, Helvetica, sans-serif";
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      meta.data.forEach(function (bar, i) {
        if (totals[i] == null) return;
        ctx.fillText('€' + formatEURShort(totals[i]), bar.x + 6, bar.y);
      });
      ctx.restore();
    }
  };

  // Draws each segment's share of the bar's total inside the segment,
  // skipping segments too narrow to hold the text legibly.
  const stackPercentPlugin = {
    id: 'stackPercent',
    afterDatasetsDraw: function (chart) {
      const ctx = chart.ctx;
      const metaSR = chart.getDatasetMeta(0);
      const metaEU = chart.getDatasetMeta(1);
      ctx.save();
      ctx.font = "600 10px 'Montserrat', Arial, Helvetica, sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const MIN_WIDTH = 26;
      metaSR.data.forEach(function (srBar, i) {
        const total = totals[i];
        if (!total) return;
        const euBar = metaEU.data[i];
        const srWidth = Math.abs(srBar.x - srBar.base);
        const euWidth = Math.abs(euBar.x - euBar.base);
        if (srWidth > MIN_WIDTH) {
          const srPct = Math.round((srAmounts[i] / total) * 100);
          ctx.fillStyle = '#1f2937';
          ctx.fillText(srPct + '%', (srBar.x + srBar.base) / 2, srBar.y);
        }
        if (euWidth > MIN_WIDTH) {
          const euPct = Math.round((euAmounts[i] / total) * 100);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(euPct + '%', (euBar.x + euBar.base) / 2, euBar.y);
        }
      });
      ctx.restore();
    }
  };

  const ctx = document.getElementById('topProjectsChart').getContext('2d');
  if (topChart) topChart.destroy();

  const xAxisShared = {
    stacked: true,
    type: scaleType,
    beginAtZero: !isLog,
    min: isLog ? xMin : 0,
    max: xMax,
    ticks: { callback: function (v) { return '€' + formatEURShort(v); } }
  };

  topChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: 'SR (€)', data: srAmounts, backgroundColor: '#7C93C7', borderRadius: 3 },
        { label: 'EU (€)', data: euAmounts, backgroundColor: '#003399', borderRadius: 3 }
      ]
    },
    plugins: [totalLabelsPlugin, stackPercentPlugin],
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      onClick: function (evt, elements) {
        if (elements.length > 0) {
          const idx = elements[0].index;
          goToProject(codes[idx], fullNames[idx]);
        }
      },
      onHover: function (evt, elements) {
        evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
      },
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          callbacks: {
            title: function (items) { return fullNames[items[0].dataIndex]; },
            label: function (item) {
              return item.dataset.label + ': €' + item.raw.toLocaleString(undefined, { maximumFractionDigits: 0 });
            },
            footer: function (items) {
              const i = items[0].dataIndex;
              return [
                'Program: ' + programs[i] + ' — ' + programNames[i],
                'Total: €' + totals[i].toLocaleString(undefined, { maximumFractionDigits: 0 })
              ];
            }
          }
        }
      },
      scales: {
        x: Object.assign({}, xAxisShared, { title: { display: true, text: 'Amount (EUR)' } }),
        x2: Object.assign({}, xAxisShared, { position: 'top', grid: { drawOnChartArea: false } }),
        y: {
          stacked: true,
          ticks: { autoSkip: false, font: { size: 10 } }
        }
      }
    }
  });
}

document.querySelectorAll('input[name="scale"]').forEach(function (radio) {
  radio.addEventListener('change', function () {
    if (lastData) renderTopChart(lastData);
  });
});

fetch(JSON_URL)
  .then(function (response) {
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  })
  .then(function (payload) {
    const data = payload.regional_funding;
    document.getElementById('updated-label').textContent = 'Last updated: ' + formatIsoDate(payload.generated_at);
    lastData = data;
    renderTopChart(data);
  })
  .catch(function (err) {
    document.getElementById('updated-label').textContent = '';
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.textContent = 'Could not load ' + JSON_URL + ': ' + err.message;
  });
</script>
</body>
</html>
